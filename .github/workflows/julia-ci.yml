name: Julia CI

on:
  push:
    branches:
      - julia-port
  pull_request:
    branches:
      - julia-port

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=multinma.jl -e 'using Pkg; Pkg.instantiate()'
      - name: Run unit tests
        run: julia --project=multinma.jl -e 'using Pkg; Pkg.test()'
      - name: Run vignette comparison tests
        run: julia --project=multinma.jl multinma.jl/test/vignette_comparison.jl

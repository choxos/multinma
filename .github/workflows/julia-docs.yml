name: Documentation

on:
  push:
    branches:
      - julia-port
    tags: ['*']
  pull_request:
    branches:
      - julia-port

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install dependencies
        run: |
          julia --project=multinma.jl -e '
            using Pkg
            Pkg.instantiate()
          '
          julia --project=multinma.jl/docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path="multinma.jl"))
            Pkg.instantiate()
          '
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=multinma.jl/docs multinma.jl/docs/make.jl
